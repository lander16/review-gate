mode = "native"

[routes]
openai = ["gemini-agy"]
gemini = ["claude-agy"]
claude = ["gemini-agy"]

[approved_services]
# Uncomment only after you approve the repository for the route's services.
# "/absolute/path/to/approved/repo" = ["antigravity", "openai"]

# Example versions and model IDs. Pin the values from your local synthetic test.
[reviewers.gemini-agy]
adapter = "agy"
service = "antigravity"
family = "gemini"
model = "gemini-4-argon-medium"
binary = "/absolute/path/to/agy"
version = "1.5.0"

[reviewers.claude-agy]
adapter = "agy"
service = "antigravity"
family = "claude"
model = "claude-sonnet-5-5-medium"
binary = "/absolute/path/to/agy"
version = "1.5.0"

[reviewers.openai-codex]
adapter = "codex"
service = "openai"
family = "openai"
model = "gpt-6.1-sol"
# Optional; omit to use the CLI default.
effort = "high"
binary = "/absolute/path/to/codex"
version = "0.166.0"
